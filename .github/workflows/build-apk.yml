name: Build Android APK (LongevityOS)

# Wraps the atlas (app/) into a signed Android APK using the zero-permission
# WebView shell (android/). Web assets are copied into assets/www at build
# time, so the APK runs fully offline; source links open in the system
# browser.
#
# Signing: set repo secrets LONGEVITYOS_KEYSTORE_B64 / _KEYSTORE_PASSWORD /
# _KEY_ALIAS / _KEY_PASSWORD for a stable identity. Without them the job
# signs with an ephemeral keystore so the sideload artifact is still
# installable (a stable upload key is required for Play updates).
#
# Nothing publishes until the SIGNED binary itself passes qa/apk-binary.mjs.
# Binaries land as build artifacts AND on the orphan media-apk branch, which
# is how they are fetched into sandboxes where artifact storage is blocked.

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "app/**"
      - "android/**"
      - ".github/workflows/build-apk.yml"

concurrency:
  group: los-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # publishes APK to the media-apk branch
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses & install packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" >/dev/null

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Bundle web app into the APK
        run: |
          set -euo pipefail
          DEST=android/app/src/main/assets/www
          rm -rf "$DEST" && mkdir -p "$DEST"
          cp -R app/. "$DEST"/
          echo "Bundled files:" && ls -R "$DEST"
          # A missing module is not a degraded APK, it is a blank screen —
          # the ES-module graph fails whole.
          for m in data grades feed app; do
            [ -s "$DEST/js/$m.js" ] || { echo "::error::module missing from bundle (js/$m.js)"; exit 1; }
          done
          # No key material may ride in a public zip.
          if grep -rlE 'sk_[0-9a-f]{32}|xi-api-key|BEGIN (EC )?PRIVATE KEY' "$DEST" >/dev/null 2>&1; then
            echo "::error::key material found in the APK bundle"; exit 1
          fi
          # The corpus is the product: import the BUNDLED data module and
          # check what actually ships.
          node --input-type=module -e '
            const base = "file://" + process.cwd() + "/android/app/src/main/assets/www/js/";
            const d = await import(base + "data.js");
            if (d.COMPOUNDS.length < 12) { console.error("::error::corpus carries only " + d.COMPOUNDS.length + " compounds"); process.exit(1); }
            for (const c of d.COMPOUNDS) for (const ev of c.evidence) {
              if (!ev.url || !ev.url.startsWith("https://") || !ev.titleCheck) {
                console.error("::error::" + c.id + " ships an unsourced evidence row"); process.exit(1);
              }
            }
            if (!/No drug has ever been shown to extend human lifespan/.test(d.HEADLINE)) {
              console.error("::error::the headline honesty is missing from the bundle"); process.exit(1);
            }
            console.log("bundle content check: " + d.COMPOUNDS.length + " compounds, every row sourced");
          '

      - name: Compute a monotonic version code
        run: |
          echo "LOS_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "LOS_VERSION_NAME=1.0.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Build release APK (unsigned)
        working-directory: android
        env:
          LOS_VERSION_CODE: ${{ env.LOS_VERSION_CODE }}
          LOS_VERSION_NAME: ${{ env.LOS_VERSION_NAME }}
        run: gradle --no-daemon assembleRelease

      - name: Resolve signing keystore
        id: ks
        env:
          KS_B64: ${{ secrets.LONGEVITYOS_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.LONGEVITYOS_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.LONGEVITYOS_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.LONGEVITYOS_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          STORE="$RUNNER_TEMP/longevityos.keystore"
          if [ -n "${KS_B64:-}" ]; then
            [ -n "${KS_PASS:-}" ]  || { echo "::error::Keystore set but LONGEVITYOS_KEYSTORE_PASSWORD missing."; exit 1; }
            [ -n "${KS_ALIAS:-}" ] || { echo "::error::Keystore set but LONGEVITYOS_KEY_ALIAS missing."; exit 1; }
            [ -n "${KEY_PASS:-}" ] || { echo "::error::Keystore set but LONGEVITYOS_KEY_PASSWORD missing."; exit 1; }
            echo "$KS_B64" | base64 -d > "$STORE"
            echo "store=$STORE"        >> "$GITHUB_OUTPUT"
            echo "storepass=$KS_PASS"  >> "$GITHUB_OUTPUT"
            echo "alias=$KS_ALIAS"     >> "$GITHUB_OUTPUT"
            echo "keypass=$KEY_PASS"   >> "$GITHUB_OUTPUT"
            echo "Using provided release keystore."
          else
            keytool -genkeypair -v -keystore "$STORE" \
              -storepass lospass -keypass lospass -alias longevityos \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=LongevityOS, OU=Photon Bounce, O=Photon Bounce, C=US"
            echo "store=$STORE"       >> "$GITHUB_OUTPUT"
            echo "storepass=lospass"  >> "$GITHUB_OUTPUT"
            echo "alias=longevityos"  >> "$GITHUB_OUTPUT"
            echo "keypass=lospass"    >> "$GITHUB_OUTPUT"
            echo "::warning::No LONGEVITYOS_KEYSTORE_B64 secret — signed with an ephemeral keystore (installable, but not a stable identity for Play updates)."
          fi

      - name: Zipalign & sign APK
        run: |
          set -euo pipefail
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          UNSIGNED=android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/zipalign" -p -f 4 "$UNSIGNED" los-aligned.apk
          "$BT/apksigner" sign \
            --ks "${{ steps.ks.outputs.store }}" \
            --ks-pass pass:"${{ steps.ks.outputs.storepass }}" \
            --ks-key-alias "${{ steps.ks.outputs.alias }}" \
            --key-pass pass:"${{ steps.ks.outputs.keypass }}" \
            --out longevityos.apk los-aligned.apk
          "$BT/apksigner" verify --verbose longevityos.apk
          ls -la longevityos.apk

      - name: Verify the signed APK binary (offline end-to-end)
        run: |
          set -euo pipefail
          npm init -y >/dev/null
          npm install --no-save playwright@1.56.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          node qa/apk-binary.mjs longevityos.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: longevityos-apk
          path: longevityos.apk
          if-no-files-found: error

      - name: Publish APK to media branch (git-fetchable binary)
        run: |
          set -e
          cp longevityos.apk /tmp/los.apk
          git config user.name "apk-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan media-apk-longevityos
          git rm -rf --cached . -q || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp /tmp/los.apk longevityos.apk
          git add longevityos.apk
          git commit -m "LongevityOS APK (auto-built, binary-verified)"
          git push -f origin media-apk-longevityos
