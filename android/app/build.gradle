plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Play requires a strictly-increasing versionCode for every upload. CI injects
// a monotonic value (base + run number) via LOS_VERSION_CODE; local builds
// fall back to 1.
def losVersionCode = (System.getenv("LOS_VERSION_CODE") ?: "1").toInteger()
def losVersionName = System.getenv("LOS_VERSION_NAME") ?: "1.0.0"

android {
    namespace 'com.photonbounce.longevityos'
    compileSdk 36

    defaultConfig {
        applicationId "com.photonbounce.longevityos"
        minSdk 26
        targetSdk 36
        versionCode losVersionCode
        versionName losVersionName
    }

    buildTypes {
        release {
            // Left unsigned here on purpose — CI zipaligns and signs the release
            // APK with a keystore (a real one from secrets, or an ephemeral one),
            // so the published artifact is always installable.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.11.0'
}
